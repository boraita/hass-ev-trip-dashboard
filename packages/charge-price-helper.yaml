# Quick-edit helper for the Cargas view's "Aplicar precio" tile.
#
# Drop into config/packages/ and replace __DEVICE__ with your trip-logger
# device slug (the same one you use everywhere else). Restart HA.
#
# The Cargas card shows an input_number tied to this helper plus a button
# that runs the script below, which calls
# `ev_trip_logger.set_last_charge_price` with the helper's value — letting
# you change the price of the MOST RECENT charge from the dashboard
# without opening Developer Tools. `set_last_charge_price` always targets
# the last charge when `charge_id` is omitted, so there's no id to manage.
#
# v0.8.10 — takes the TOTAL amount paid (what's on the receipt), not
# €/kWh: asking for €/kWh directly caused a real mistake — a €9.49 total
# typed into a €/kWh field priced an 18.7 kWh charge at €177.44.
# `set_last_charge_price` already supports `total_cost` and divides by
# the charge's own kWh itself, so the helper just passes the total
# straight through.

input_number:
  __DEVICE___charge_total_edit:
    name: Total paid to apply
    icon: mdi:cash-edit
    min: 0
    max: 500
    step: 0.01
    mode: box
    unit_of_measurement: "€"
    initial: 0

script:
  __DEVICE___apply_charge_price:
    alias: "__DEVICE__ apply charge price"
    sequence:
      - action: ev_trip_logger.set_last_charge_price
        data:
          total_cost: "{{ states('input_number.__DEVICE___charge_total_edit') | float(0) }}"
