# Vehicle physical status — doors, windows, frunk/trunk, cabin air,
# thermal sensors. Inspired by the BYD app's "Vehicle Details" modal.
# All entities are manufacturer-specific; replace placeholders:
#
#   __VEHICLE__       → manufacturer prefix (e.g. byd_sealion_7)
#
# Sensors/binary_sensors expected (BYD example):
#   binary_sensor.__VEHICLE___front_left_door / _front_right_door /
#     _rear_left_door / _rear_right_door / _frunk / _trunk
#   binary_sensor.__VEHICLE___front_left_window / _front_right_window /
#     _rear_left_window / _rear_right_window
#   sensor.__VEHICLE___cabin_temperature
#   sensor.__VEHICLE___exterior_temperature
#   sensor.__VEHICLE___pm2_5
#
# If your integration uses different names, edit the entity_id lines —
# the placeholder substitution only replaces __VEHICLE__.
# Doors/windows are treated as indeterminate (grey, mdi:help-circle-outline)
# rather than "closed" when any source is unavailable/unknown — a false
# "all closed" is a safety-relevant false negative, not a cosmetic issue.

type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Estado del vehículo
    subtitle: Puertas, ventanas, cabina, calidad de aire

  # ── DOORS / FRUNK / TRUNK ─────────────────────────────────────────
  - type: custom:mushroom-template-card
    primary: Aperturas
    secondary: >-
      {% set parts = namespace(open=[], unknown=false) %}
      {% for key in [
        ('front_left_door','FL'),('front_right_door','FR'),
        ('rear_left_door','RL'),('rear_right_door','RR'),
        ('frunk','Frunk'),('trunk','Maletero')
      ] %}
        {% set st = states('binary_sensor.__VEHICLE___' ~ key[0]) %}
        {% if st in ['unavailable', 'unknown'] %}
          {% set parts.unknown = true %}
        {% elif st == 'on' %}
          {% set parts.open = parts.open + [key[1]] %}
        {% endif %}
      {% endfor %}
      {% if parts.unknown %}
        Estado desconocido
      {% elif parts.open | length == 0 %}
        Todo cerrado
      {% else %}
        Abierto: {{ parts.open | join(', ') }}
      {% endif %}
    icon: >-
      {% set ns = namespace(unknown=false) %}
      {% for key in ['front_left_door','front_right_door','rear_left_door','rear_right_door','frunk','trunk'] %}
        {% if states('binary_sensor.__VEHICLE___' ~ key) in ['unavailable', 'unknown'] %}
          {% set ns.unknown = true %}
        {% endif %}
      {% endfor %}
      {{ 'mdi:help-circle-outline' if ns.unknown else 'mdi:car-door' }}
    icon_color: >-
      {% set ns = namespace(any_open=false, unknown=false) %}
      {% for key in ['front_left_door','front_right_door','rear_left_door','rear_right_door','frunk','trunk'] %}
        {% set st = states('binary_sensor.__VEHICLE___' ~ key) %}
        {% if st in ['unavailable', 'unknown'] %}
          {% set ns.unknown = true %}
        {% elif st == 'on' %}
          {% set ns.any_open = true %}
        {% endif %}
      {% endfor %}
      {{ 'grey' if ns.unknown else ('red' if ns.any_open else 'green') }}
    fill_container: true

  # ── WINDOWS ───────────────────────────────────────────────────────
  - type: custom:mushroom-template-card
    primary: Ventanas
    secondary: >-
      {% set parts = namespace(open=[], unknown=false) %}
      {% for key in [
        ('front_left_window','FL'),('front_right_window','FR'),
        ('rear_left_window','RL'),('rear_right_window','RR')
      ] %}
        {% set st = states('binary_sensor.__VEHICLE___' ~ key[0]) %}
        {% if st in ['unavailable', 'unknown'] %}
          {% set parts.unknown = true %}
        {% elif st == 'on' %}
          {% set parts.open = parts.open + [key[1]] %}
        {% endif %}
      {% endfor %}
      {% if parts.unknown %}
        Estado desconocido
      {% elif parts.open | length == 0 %}
        Todas cerradas
      {% else %}
        Abierta: {{ parts.open | join(', ') }}
      {% endif %}
    icon: >-
      {% set ns = namespace(unknown=false) %}
      {% for key in ['front_left_window','front_right_window','rear_left_window','rear_right_window'] %}
        {% if states('binary_sensor.__VEHICLE___' ~ key) in ['unavailable', 'unknown'] %}
          {% set ns.unknown = true %}
        {% endif %}
      {% endfor %}
      {{ 'mdi:help-circle-outline' if ns.unknown else 'mdi:car-windshield' }}
    icon_color: >-
      {% set ns = namespace(any_open=false, unknown=false) %}
      {% for key in ['front_left_window','front_right_window','rear_left_window','rear_right_window'] %}
        {% set st = states('binary_sensor.__VEHICLE___' ~ key) %}
        {% if st in ['unavailable', 'unknown'] %}
          {% set ns.unknown = true %}
        {% elif st == 'on' %}
          {% set ns.any_open = true %}
        {% endif %}
      {% endfor %}
      {{ 'grey' if ns.unknown else ('amber' if ns.any_open else 'green') }}
    fill_container: true

  # ── THERMAL SENSORS ───────────────────────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.__VEHICLE___cabin_temperature
        name: Cabina
        show_state: true
        icon: mdi:car-seat
        styles:
          card:
            - padding: 12px
            - border-radius: 16px
          name:
            - font-size: 12px
            - opacity: "0.7"
          state:
            - font-size: 22px
            - font-weight: bold

      - type: custom:button-card
        entity: sensor.__VEHICLE___exterior_temperature
        name: Exterior
        show_state: true
        icon: mdi:thermometer
        styles:
          card:
            - padding: 12px
            - border-radius: 16px
          name:
            - font-size: 12px
            - opacity: "0.7"
          state:
            - font-size: 22px
            - font-weight: bold

  # ── AIR QUALITY (PM2.5) ────────────────────────────────────────────
  # A single sensor — this vehicle doesn't expose separate interior/
  # exterior PM2.5 readings.
  - type: custom:button-card
    entity: sensor.__VEHICLE___pm2_5
    name: Calidad del aire (PM2.5)
    show_state: true
    icon: mdi:air-filter
    styles:
      card:
        - padding: 12px
        - border-radius: 16px
      name:
        - font-size: 12px
        - opacity: "0.7"
      state:
        - font-size: 22px
        - font-weight: bold
