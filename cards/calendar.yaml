# Pantalla 2 — Monthly activity calendar for the BYD EV.
#
# HACS dependencies (install via HACS → Frontend):
#   - custom:calendar-card-pro          (preferred, used below)
#   - custom:mushroom-title-card        (required for the header)
#   - custom:atomic-calendar-revive     (fallback — see commented block at the bottom)
#   - custom:browser_mod                (optional — enables the popup on day click)
#
# Calendar entity: `calendar.__DEVICE___activity` is exposed by the
# hass-ev-trip-logger integration. Each day with activity becomes one all-day
# event whose summary looks like: "2 trips · 23.0 km · 1 charge" (always
# generated in English by the integration, regardless of dashboard language).
# Replace __DEVICE__ with your device slug.

type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Actividad EV
    icon: mdi:calendar
    icon_color: blue

  - type: custom:calendar-card-pro
    entities:
      # Match "charge" → blue lightning, "trip" → green car. The integration
      # always generates the summary in English ("N trip(s) · M charge(s)"),
      # regardless of dashboard language — calendar-card-pro applies the
      # first matching rule per event.
      - entity: calendar.__DEVICE___activity
        color: "#1976d2"
        icon: mdi:lightning-bolt
        accumulate_by: day
        label: "charge"
      - entity: calendar.__DEVICE___activity
        color: "#2e7d32"
        icon: mdi:car
        accumulate_by: day
        label: "trip"
    # Monthly grid view with built-in navigation arrows.
    view: month
    show_navigation: true
    show_today: true
    first_day_of_week: monday
    language: es
    time_format: 24
    max_events_to_show: 4
    compact_events_to_show: 2
    show_empty_days: true
    # Click a day → browser_mod popup if available, else native event details.
    # The calendar entity has no `all_events` attribute (calendar.py never
    # defines extra_state_attributes) and `sensor.date` doesn't exist on
    # this instance, so neither can be read via state_attr(). The
    # coordinator's own `event` property is already scoped to TODAY only
    # (see calendar.py: async_update builds [today, today+1)), and HA's
    # base CalendarEntity exposes that as the `message`/`description`
    # attributes — no extra plumbing needed. This popup can only ever show
    # today's activity, never an arbitrary tapped day.
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Actividad de hoy
          size: normal
          content:
            type: markdown
            content: |
              {% set msg = state_attr('calendar.__DEVICE___activity', 'message') %}
              {% set desc = state_attr('calendar.__DEVICE___activity', 'description') %}
              {% if not msg %}
              _Sin actividad registrada para hoy._
              {% else %}
              **{{ msg }}**
              {{ desc or '' }}
              {% endif %}

# -----------------------------------------------------------------------------
# Fallback using custom:atomic-calendar-revive (uncomment if you prefer it):
#
# - type: custom:atomic-calendar-revive
