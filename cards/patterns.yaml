        tap_action:
          action: more-info
          entity: sensor.__DEVICE___trip_patterns

      - type: custom:mushroom-template-card
        primary: S
        secondary: >-
          {{ (state_attr('sensor.__DEVICE___trip_patterns','km_by_weekday') or
          {}).get('5', 0) | round(0) }} km
        icon: mdi:calendar-weekend
        icon_color: orange
        layout: vertical
        fill_container: true
        tap_action:
