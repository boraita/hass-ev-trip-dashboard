          entity: sensor.__DEVICE___trip_patterns

      - type: custom:mushroom-template-card
        primary: V
        secondary: >-
          {{ (state_attr('sensor.__DEVICE___trip_patterns','km_by_weekday') or
          {}).get('4', 0) | round(0) }} km
        icon: mdi:calendar-today
        icon_color: amber
        layout: vertical
