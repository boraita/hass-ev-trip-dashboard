# Pantalla 5 — Efficiency view (BYD app style).
# Monthly avg consumption line + Efficiency vs Distance scatter + Temperature bar.
# Replace __DEVICE__ with your device slug.
#
# Requires HACS:
#   - custom:apexcharts-card
#   - custom:mushroom-title-card
#   - custom:mushroom-template-card
#   - custom:button-card

type: vertical-stack
cards:
  # ===== Header =====
  - type: custom:mushroom-title-card
    title: Eficiencia
    subtitle: Consumo, distancia y temperatura
    alignment: start

  # ===== Hero: 30-day average consumption =====
  - type: custom:button-card
    entity: sensor.__DEVICE___avg_consumption_30_days
    name: Consumo medio (30 días)
    show_state: true
    show_icon: true
    icon: mdi:leaf
    styles:
      card:
        - padding: 18px
        - border-radius: 16px
        - background: linear-gradient(135deg, rgba(46,160,67,0.18), rgba(46,160,67,0.04))
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 64px 1fr
        - grid-template-rows: auto auto
      icon:
        - color: '#2ea043'
        - width: 48px
      name:
        - justify-self: start
        - font-size: 14px
        - opacity: 0.75
      state:
        - justify-self: start
        - font-size: 28px
        - font-weight: 600
        - color: '#2ea043'
    state_display: |
      [[[ return `${entity.state} kWh/100km`; ]]]

  # ===== Monthly avg consumption (LINE) =====
  # Show chart only if attrs.months has entries; otherwise placeholder.
  # data_generator: walk attrs.months, parse "YYYY-MM" -> first-of-month timestamp,
  # compute kWh/100km = energy_kwh / distance_km * 100 (guard /0).
  - type: conditional
    conditions:
      # HA 2026.7.4 rejects `condition: template` here with "Conditions are
      # invalid" and renders an error card instead of this one.
      - condition: numeric_state
        entity: sensor.__DEVICE___monthly_history
        above: 0
    card:
      type: custom:apexcharts-card
      header:
        show: true
        title: Avg consumption per month (kWh/100km)
        show_states: false
      graph_span: 730d
      span:
        end: month
      apex_config:
        chart:
          height: 260
          type: line
        stroke:
          curve: smooth
          width: 3
        markers:
          size: 4
        dataLabels:
          enabled: false
        grid:
          borderColor: rgba(255,255,255,0.08)
        tooltip:
          x:
            format: MMM yyyy
        xaxis:
          type: datetime
          labels:
            datetimeFormatter:
              year: yyyy
              month: "MMM 'yy"
        yaxis:
          decimalsInFloat: 1
          title:
            text: kWh/100km
      series:
        - entity: sensor.__DEVICE___monthly_history
          name: Consumo
          color: '#2ea043'
          type: line
          float_precision: 1
          data_generator: |
            const months = (entity.attributes && entity.attributes.months) || [];
            return months.map((m) => {
              const km = Number(m.distance_km) || 0;
              const kwh = Number(m.energy_kwh) || 0;
              if (km <= 0) return null;
              const cons = (kwh / km) * 100;
              let ts = null;
              const raw = String(m.month || '');
              const parts = raw.split('-').map(Number);
              if (parts.length >= 2 && parts[0] && parts[1]) {
                ts = new Date(parts[0], parts[1] - 1, 1).getTime();
              } else {
                const d = new Date(raw);
                ts = isNaN(d.getTime()) ? null : d.getTime();
              }
              if (ts == null) return null;
              return [ts, Math.round(cons * 10) / 10];
            }).filter((p) => p !== null);
  - type: conditional
    conditions:
      # HA 2026.7.4 rejects `condition: template` here with "Conditions are
      # invalid" and renders an error card instead of this one.
      - condition: numeric_state
        entity: sensor.__DEVICE___monthly_history
        below: 1
    card:
      type: custom:mushroom-template-card
      primary: Avg consumption per month
      secondary: Aún no hay meses con datos.
      icon: mdi:chart-line
      icon_color: grey
      fill_container: true

  # ===== Efficiency vs Distance (SCATTER) =====
  # x = distance_km, y = consumption_kwh_100km.
  # Three series split by score band (score is 0-10 from the integration).
  # NOTE: graph_span set huge so apexcharts-card's time-window filter never
  # discards numeric x values (km values would otherwise be read as epoch ms
  # and filtered out).
  - type: conditional
    conditions:
      # HA 2026.7.4 rejects `condition: template` here with "Conditions are
      # invalid" and renders an error card instead of this one.
      - condition: numeric_state
        entity: sensor.__DEVICE___recent_trips
        above: 0
    card:
      type: custom:apexcharts-card
      header:
        show: true
        title: Efficiency vs Distance
        show_states: false
      chart_type: scatter
      graph_span: 30000d
      apex_config:
        chart:
          height: 280
          type: scatter
          zoom:
            enabled: false
        dataLabels:
          enabled: false
        grid:
          borderColor: rgba(255,255,255,0.08)
        legend:
          show: true
          position: bottom
        markers:
          size: 6
          strokeWidth: 0
        tooltip:
          shared: false
          intersect: true
          x:
            formatter: |
              EVAL:function(val){ return (val != null ? val.toFixed(1) : '') + ' km'; }
          y:
            formatter: |
              EVAL:function(val){ return (val != null ? val.toFixed(1) : '') + ' kWh/100km'; }
        xaxis:
          type: numeric
          title:
            text: Distance (km)
          decimalsInFloat: 0
          min: 0
          labels:
            formatter: |
              EVAL:function(val){ return Math.round(val) + ''; }
        yaxis:
          title:
            text: kWh/100km
          decimalsInFloat: 1
          min: 0
      series:
        - entity: sensor.__DEVICE___recent_trips
          name: Score ≥ 7
          color: '#2ea043'
          type: scatter
          data_generator: |
            const trips = (entity.attributes && entity.attributes.trips) || [];
            return trips
              .filter((t) => {
                const s = Number(t.score);
                return !isNaN(s) && s >= 7
                  && t.distance_km != null
                  && t.consumption_kwh_100km != null;
              })
              .map((t) => [Number(t.distance_km), Number(t.consumption_kwh_100km)]);
        - entity: sensor.__DEVICE___recent_trips
          name: Score 4–7
          color: '#f0883e'
          type: scatter
          data_generator: |
            const trips = (entity.attributes && entity.attributes.trips) || [];
            return trips
              .filter((t) => {
                const s = Number(t.score);
                return !isNaN(s) && s >= 4 && s < 7
                  && t.distance_km != null
                  && t.consumption_kwh_100km != null;
              })
              .map((t) => [Number(t.distance_km), Number(t.consumption_kwh_100km)]);
        - entity: sensor.__DEVICE___recent_trips
          name: Score < 4
          color: '#f85149'
          type: scatter
          data_generator: |
            const trips = (entity.attributes && entity.attributes.trips) || [];
            return trips
              .filter((t) => {
                const s = Number(t.score);
                return (isNaN(s) || s < 4)
                  && t.distance_km != null
                  && t.consumption_kwh_100km != null;
              })
              .map((t) => [Number(t.distance_km), Number(t.consumption_kwh_100km)]);
  - type: conditional
    conditions:
      # HA 2026.7.4 rejects `condition: template` here with "Conditions are
      # invalid" and renders an error card instead of this one.
      - condition: numeric_state
        entity: sensor.__DEVICE___recent_trips
        below: 1
    card:
      type: custom:mushroom-template-card
      primary: Efficiency vs Distance
      secondary: Sin trayectos recientes para mostrar.
      icon: mdi:scatter-plot
      icon_color: grey
      fill_container: true

  # ===== Consumption by temperature bucket =====
  # Reads attrs.by_bucket from sensor.__DEVICE___consumption_by_temperature.
  # Object shape: {"-5": 22.1, "0": 19.4, ...}, keys = each bucket's lower
  # bound in °C, dynamic — the set of buckets that exist follows whatever
  # temperatures the user has actually driven in, so there's no fixed
  # category list to hardcode.
  #
  # Dropped the apexcharts-card bar chart here (#24), for the same reason
  # as the "Por día" chart in patterns.yaml: apexcharts-card injects a
  # datetime xaxis.min/max derived from `graph_span` regardless of
  # xaxis.type, which converts a category axis back to numeric and the
  # series (`[["25°C", 20.9], ...]`) then has nothing to map onto —
  # confirmed on a live instance, 0 rendered marks, `TypeError: Cannot
  # read properties of null (reading 'yRatio')`. No config-only fix found.
  # A markdown bar list needs no chart library and handles the dynamic
  # bucket count/labels more naturally than a fixed chart shape would.
  - type: conditional
    conditions:
      # HA 2026.7.4 rejects `condition: template` here with "Conditions are
      # invalid" and renders an error card instead of this one.
      - condition: numeric_state
        entity: sensor.__DEVICE___consumption_by_temperature
        above: 0
    card:
      type: markdown
      title: Consumption by temperature (kWh/100km)
      content: >-
        {% set buckets = state_attr('sensor.__DEVICE___consumption_by_temperature', 'by_bucket') or {} %}
        {% set size = state_attr('sensor.__DEVICE___consumption_by_temperature', 'bucket_size_c') | float(5) %}
        {% set keys = buckets.keys() | map('int') | list | sort %}
        {% set maxv = buckets.values() | list | max %}
        {% for k in keys %}
        {%- set v = buckets[k | string] | float(0) %}
        {%- set pct = ((v / maxv) * 100) | round(0) if maxv > 0 else 0 %}
        **{{ k }}–{{ (k + size) | int }}°C** · {{ '%.1f' | format(v) }} kWh/100km
        <div style="background:var(--divider-color);border-radius:4px;height:8px;margin:2px 0 12px;">
          <div style="background:#2ea043;border-radius:4px;height:8px;width:{{ pct }}%;"></div>
        </div>
        {% endfor %}
  - type: conditional
    conditions:
      # HA 2026.7.4 rejects `condition: template` here with "Conditions are
      # invalid" and renders an error card instead of this one.
      - condition: numeric_state
        entity: sensor.__DEVICE___consumption_by_temperature
        below: 1
    card:
      type: custom:mushroom-template-card
      primary: Consumption by temperature
      secondary: >-
        Sin datos de temperatura todavía — necesita trayectos con
        temperatura media registrada.
      icon: mdi:thermometer-off
      icon_color: grey
      fill_container: true

  # ===== Footer hint =====
  - type: custom:mushroom-template-card
    primary: Consejo de eficiencia
    secondary: >-
      {% set c = states('sensor.__DEVICE___avg_consumption_30_days') | float(0) %}
      {% if c == 0 %} Sin datos suficientes todavía.
      {% elif c < 16 %} Excelente — mantienes un consumo muy eficiente.
      {% elif c < 19 %} Buen consumo, dentro de lo esperado.
      {% elif c < 22 %} Algo elevado: revisa estilo de conducción o clima.
      {% else %} Consumo alto: trayectos cortos/frío/autopista influyen mucho.
      {% endif %}
    icon: mdi:lightbulb-on-outline
    icon_color: |-
      {% set c = states('sensor.__DEVICE___avg_consumption_30_days') | float(0) %}
      {% if c == 0 %} grey
      {% elif c < 19 %} green
      {% elif c < 22 %} orange
      {% else %} red
      {% endif %}
    fill_container: true
