# Trip + charge events as a timeline.
#
# The native `logbook` card depends on the recorder actually keeping
# history for last_trip_distance / last_charge_energy — on this instance
# recorder returned 0 entries for both over 2 and 7 day windows despite
# real trips/charges in that window (recorder config issue, root cause
# not determinable from the dashboard side). Instead of depending on
# recorder at all, this builds the timeline directly from the
# recent_trips / recent_charges sensor attributes ev_trip_logger already
# maintains — robust to any recorder retention policy.
# Replace __DEVICE__ with your device slug.

type: vertical-stack
cards:
  - type: markdown
    content: |
      {%- set trips = state_attr('sensor.__DEVICE___recent_trips', 'trips') or [] %}
      {%- set charges = state_attr('sensor.__DEVICE___recent_charges', 'charges') or [] %}
      {%- set ns = namespace(rows=[]) %}
      {#- Trip endpoints and charge locations arrive as 'home', a zone name, or
          the raw 'not_home' token — never show the token. -#}
      {%- macro place(v, dflt='—') %}{{ dflt if not v else ('Fuera' if v | lower in ['not_home','unknown','outside known zones'] else ('Casa' if v | lower == 'home' else v)) }}{%- endmacro %}
      {%- for t in trips %}
        {%- set ns.rows = ns.rows + [{
          'ts': t.ended_at, 'kind': 'trip',
          'label': (place(t.origin) | trim) ~ ' → ' ~ (place(t.destination) | trim),
          'detail': (t.distance_km ~ ' km' if t.distance_km is not none else '—')
            ~ (' · ' ~ (t.consumption_kwh_100km | round(1)) ~ ' kWh/100km' if t.consumption_kwh_100km is not none else ''),
        }] %}
      {%- endfor %}
      {%- for c in charges %}
        {%- set ns.rows = ns.rows + [{
          'ts': c.ended_at or c.started_at, 'kind': 'charge',
          'label': place(c.location, 'Carga') | trim,
          'detail': (c.kwh | float(0) | round(2)) ~ ' kWh'
            ~ (' · ' ~ (c.total_cost | float(0) | round(2)) ~ ' ' ~ (c.currency or '€') if c.total_cost is not none else ''),
        }] %}
      {%- endfor %}
      {%- set rows = ns.rows | rejectattr('ts', 'none') | sort(attribute='ts', reverse=true) | list %}
      ### Actividad reciente
      {%- if rows | length == 0 %}

      _Sin trips ni cargas registrados aún._
      {%- else %}
      {%- for r in rows[:30] %}
      {%- set dt = as_datetime(r.ts) %}
      {{ '🚗' if r.kind == 'trip' else '🔌' }} **{{ dt.strftime('%d/%m %H:%M') if dt else '—' }}** — {{ r.label }}
      {{ r.detail }}

      {%- endfor %}
      {%- endif %}
